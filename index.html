<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>မင်းအရမ်းလှတယ်</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    body{font-family:'Padauk',sans-serif}

    .bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#0a0015,#1a0030 30%,#2d1050 55%,#0d0020);background-size:300% 300%;animation:bgS 20s ease infinite}
    @keyframes bgS{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .amb{position:fixed;border-radius:50%;filter:blur(80px);z-index:1;pointer-events:none;opacity:.12}
    .a1{width:300px;height:300px;background:#ff6b9d;top:10%;left:-10%;animation:d1 12s ease-in-out infinite}
    .a2{width:250px;height:250px;background:#c44dff;bottom:15%;right:-8%;animation:d2 15s ease-in-out infinite}
    .a3{width:200px;height:200px;background:#ff4d8d;top:50%;left:50%;animation:d3 18s ease-in-out infinite}
    @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
    @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-40px)}}
    @keyframes d3{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-30%,-60%)}}

    .prompt{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;pointer-events:none;transition:opacity 1.5s}
    .prompt.hide{opacity:0}
    .prompt-heart{font-size:4rem;margin-bottom:1rem;animation:pp 2s ease-in-out infinite}
    @keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    .prompt h2{color:rgba(255,255,255,.45);font-size:.95rem;letter-spacing:1.5px;font-weight:400}
    .prompt p{color:rgba(255,255,255,.28);font-size:.8rem;margin-top:.4rem}

    .float-heart{position:fixed;z-index:10;cursor:pointer;pointer-events:auto;animation:fU var(--dur) linear forwards;filter:drop-shadow(0 0 8px var(--glow));font-size:var(--size);will-change:transform,opacity}
    .float-heart:active{transform:scale(1.4)}
    @keyframes fU{0%{opacity:0;transform:translateX(0) translateY(0) scale(.5)}5%{opacity:1;transform:translateX(0) translateY(-5vh) scale(1)}25%{transform:translateX(var(--sx1)) translateY(-25vh) rotate(-8deg)}50%{transform:translateX(var(--sx2)) translateY(-50vh) rotate(10deg) scale(1.05)}75%{transform:translateX(var(--sx3)) translateY(-75vh) rotate(-5deg)}95%{opacity:.7}100%{opacity:0;transform:translateX(var(--sx4)) translateY(-115vh) rotate(15deg) scale(.7)}}

    .msg{position:fixed;z-index:100;pointer-events:none;white-space:nowrap;font-weight:700;text-align:center;color:var(--c);text-shadow:0 0 12px var(--c),0 0 25px var(--c);animation:mP 2.8s ease-out forwards;transform:translate(-50%,-50%)}
    @keyframes mP{0%{opacity:0;transform:translate(-50%,-50%) scale(.2);filter:blur(6px)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.2);filter:blur(0)}25%{transform:translate(-50%,-50%) scale(1)}65%{opacity:.9;transform:translate(-50%,-65%)}100%{opacity:0;transform:translate(-50%,-130%) scale(.5);filter:blur(3px)}}

    .burst{position:fixed;z-index:90;pointer-events:none;font-size:1rem;animation:bF 1.4s ease-out forwards}
    @keyframes bF{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1) rotate(var(--br))}}

    .ring{position:fixed;z-index:85;pointer-events:none;width:50px;height:50px;border-radius:50%;border:2px solid var(--rc);transform:translate(-50%,-50%) scale(0);animation:rE .9s ease-out forwards}
    @keyframes rE{0%{transform:translate(-50%,-50%) scale(0);opacity:.6}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}

    .dot{position:fixed;z-index:95;pointer-events:none;width:3px;height:3px;border-radius:50%;background:var(--dc);box-shadow:0 0 5px var(--dc);animation:dF .6s ease-out forwards}
    @keyframes dF{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0) translateY(-12px)}}

    .timer-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#ff6b9d,#c44dff,#ff4d8d);z-index:200;transition:width .3s linear;box-shadow:0 0 10px #ff6b9d}

    .top-title{position:fixed;top:max(env(safe-area-inset-top,1rem),1.2rem);left:50%;transform:translateX(-50%);color:rgba(255,255,255,.1);font-size:.65rem;letter-spacing:3px;z-index:60;pointer-events:none}
    .counter{position:fixed;bottom:max(env(safe-area-inset-bottom,1rem),1.2rem);left:50%;transform:translateX(-50%);color:rgba(255,255,255,.18);font-size:.7rem;letter-spacing:2px;z-index:60;pointer-events:none}
    .counter span{color:rgba(255,182,193,.45);font-weight:700;font-size:.85rem}

    /* ── Lucky Box ── */
    .lucky-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);opacity:0;pointer-events:none;transition:opacity .8s,background .8s}
    .lucky-overlay.show{opacity:1;pointer-events:auto;background:rgba(0,0,0,.6)}

    .lucky-box{width:260px;padding:30px 24px;border-radius:24px;background:linear-gradient(135deg,#1a1035,#2a1550,#1a1035);border:1.5px solid rgba(255,107,157,.25);box-shadow:0 0 60px rgba(196,77,255,.15),0 0 120px rgba(255,77,141,.1),inset 0 1px 0 rgba(255,255,255,.08);text-align:center;transform:scale(.5) rotate(-10deg);transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .4s;opacity:0;position:relative;overflow:hidden}
    .lucky-overlay.show .lucky-box{transform:scale(1) rotate(0);opacity:1}

    .lucky-box::before{content:'';position:absolute;inset:-2px;border-radius:26px;background:linear-gradient(135deg,#ff6b9d33,#c44dff33,#ff4d8d33);z-index:-1;animation:borderGlow 3s ease-in-out infinite}
    @keyframes borderGlow{0%,100%{opacity:.4}50%{opacity:.8}}

    .lucky-box .box-icon{font-size:3.5rem;margin-bottom:.8rem;animation:boxBounce 2s ease-in-out infinite}
    @keyframes boxBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}

    .lucky-box .box-label{color:rgba(255,255,255,.4);font-size:.7rem;letter-spacing:2px;margin-bottom:.5rem}
    .lucky-box .box-count{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#ff6b9d,#c44dff,#ff4d8d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
    .lucky-box .box-sub{color:rgba(255,255,255,.3);font-size:.75rem;margin-bottom:1.2rem}

    .lucky-actions{display:flex;flex-direction:column;gap:12px;align-items:center}
    .lucky-box .open-btn,.lucky-box .restart-btn,.lucky-msg-card .restart-btn{display:inline-block;padding:12px 36px;border-radius:50px;border:none;color:#fff;font-family:'Padauk',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
    .lucky-box .open-btn{background:linear-gradient(135deg,#ff6b9d,#c44dff);box-shadow:0 4px 25px rgba(196,77,255,.35)}
    .lucky-box .open-btn:active,.lucky-box .restart-btn:active,.lucky-msg-card .restart-btn:active{transform:scale(.95)}
    .lucky-box .restart-btn,.lucky-msg-card .restart-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 18px rgba(0,0,0,.2)}

    /* ── Lucky Message (after open) ── */
    .lucky-msg-overlay{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0);opacity:0;pointer-events:none;transition:opacity 1s,background 1s}
    .lucky-msg-overlay.show{opacity:1;pointer-events:auto;background:rgba(5,0,15,.85)}

    .lucky-msg-card{max-width:320px;width:100%;padding:35px 25px;border-radius:28px;background:linear-gradient(160deg,#120025,#1e0845,#120025);border:1px solid rgba(255,107,157,.2);box-shadow:0 0 80px rgba(196,77,255,.12);text-align:center;transform:scale(.3);transition:transform .8s cubic-bezier(.34,1.56,.64,1);opacity:0}
    .lucky-msg-overlay.show .lucky-msg-card{transform:scale(1);opacity:1}

    .lucky-msg-card .msg-icon{font-size:3rem;margin-bottom:1rem;animation:sparkle 2s ease-in-out infinite}
    @keyframes sparkle{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.1)}}

    .lucky-msg-card .msg-text{color:rgba(255,255,255,.85);font-size:1.05rem;line-height:1.8;margin-bottom:1.5rem;text-shadow:0 0 20px rgba(255,107,157,.2)}
    .lucky-msg-card .msg-footer{color:rgba(255,182,193,.35);font-size:.7rem;letter-spacing:2px}
    .lucky-msg-card .msg-hearts{margin-top:1rem;font-size:1.2rem;letter-spacing:4px;animation:fadeInUp 1s ease .5s both}
    .lucky-msg-card .restart-btn{margin-top:1.4rem}
    @keyframes fadeInUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}

    /* ── Music Button ── */
    .music-btn{position:fixed;top:max(env(safe-area-inset-top,1rem),1.2rem);right:1rem;z-index:300;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s,box-shadow .2s;box-shadow:0 0 15px rgba(196,77,255,.1)}
    .music-btn:active{transform:scale(.9)}
    .music-btn.playing{box-shadow:0 0 20px rgba(255,107,157,.25);border-color:rgba(255,107,157,.3)}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="amb a1"></div><div class="amb a2"></div><div class="amb a3"></div>
  <div class="timer-bar" id="timerBar"></div>
  <audio id="bgMusic" src="song.mp3" preload="auto" loop></audio>
  <div class="music-btn" id="musicBtn">🔇</div>

  <div class="prompt" id="prompt">
    <div class="prompt-heart">🌻</div>
    <h2>နေကြာပန်းလေးတွေကို ထိလိုက်ပါ</h2>
    <p>Touch the floating sunflowers</p>
  </div>

  <div class="top-title">✦ with love ✦</div>
  <div class="counter" id="ctr">🌻 <span id="cnt">0</span></div>

  <!-- Lucky Box -->
  <div class="lucky-overlay" id="luckyOverlay">
    <div class="lucky-box" id="luckyBox">
      <div class="box-icon">🎁</div>
      <div class="box-label">YOUR LUCKY COUNT</div>
      <div class="box-count" id="boxCount">0</div>
      <div class="box-sub">sunflower တွေ ဖမ်းမိတယ်</div>
      <div class="lucky-actions">
        <button class="open-btn" id="openBtn">ဖွင့်ကြည့်မယ် 🌻</button>
        <button class="restart-btn" id="restartBtn">ထပ်ဆော့မယ် 🔁</button>
      </div>
    </div>
  </div>

  <!-- Lucky Message -->
  <div class="lucky-msg-overlay" id="luckyMsgOverlay">
    <div class="lucky-msg-card">
      <div class="msg-icon">💌</div>
      <div class="msg-text" id="luckyMsgText"></div>
      <div class="msg-hearts">🌻 🌻 🌻 🌻 🌻</div>
      <div class="msg-footer">✦ WITH SUNFLOWER LOVE ✦</div>
      <button class="restart-btn" id="messageRestartBtn">နောက်တစ်ခါ ထပ်ဆော့မယ် ✨</button>
    </div>
  </div>

<script>
const C=['#ffb703','#fb8500','#ffd166','#f4a261','#e9c46a','#ffcb77','#ff9f1c','#f6bd60','#84a59d','#2a9d8f','#e76f51','#00d2d3'];
const M=['မင်းအရမ်းလှတယ် 🌻','မင်းအရမ်းလှတယ် ✨','အရမ်းလှတယ် 🌻','လှလိုက်တာ 🌻','မင်းချစ်စရာကြီး 🥰','ချစ်တယ် 🌻','အရမ်းချစ်တယ် 🌻','မင်းကိုသတိရတယ်','နေကြာပန်းလေးလို လှတယ် 🌻','မင်းက အချစ်ဆုံး','လွမ်းတယ် 🌙','အမြဲချစ်မယ် 🌻','ပန်းလေးလိုလှတယ် 🌸','ကြယ်လေးလိုတောက်ပတယ် ⭐','I Love You 🌻','So Beautiful 🦋','သိပ်ချစ်တယ် 🌻'];
const H=['🌻','🌻','🌻','🌻','🌻','🌻'];
const BI=['🌻','✨','🌼','⭐','🦋','💫','🌞'];

const LUCKY_MSGS=[
  'မင်းရဲ့အပြုံးဟာ\nငါ့ကမ္ဘာကြီးကို\nပြောင်းပြန်လှန်ပစ်နိုင်တယ် 🌻',
  'မင်းမရှိတဲ့ တစ်နေ့တစ်နေ့ဟာ\nငါ့အတွက် နှစ်ပေါင်းများစွာ\nကြာသလိုပဲ 🌙',
  'ငါ့နှလုံးသားထဲမှာ\nမင်းတစ်ယောက်ပဲ\nအစဉ်အမြဲ ရှိနေမယ် 🌻',
  'မင်းကို ပထမဆုံး\nတွေ့တဲ့နေ့ကတည်းက\nငါ့ဘဝ ပြောင်းသွားခဲ့တယ် ✨',
  'လောကကြီးတစ်ခုလုံးမှာ\nမင်းလိုလူမျိုး\nနောက်ထပ် ရှိမှာ မဟုတ်ဘူး 🦋',
  'ငါ့အတွက် အလှဆုံးအရာက\nမင်းရဲ့ ရှေ့မှာ ရှိနေရတာပဲ 🌸',
  'နက်ဖြန် ဘာဖြစ်မယ် မသိဘူး\nဒါပေမယ့် မင်းနဲ့အတူဆို\nဘာမဆို ရင်ဆိုင်နိုင်တယ် 💪🌻',
  'မင်းရဲ့ မျက်လုံးလေးတွေဟာ\nကြယ်တွေထက် ပိုတောက်ပတယ်\nသိလား 🌟',
  'ငါ့ကို အဖြေဘယ်တော့ပေးမှာလည်း 🌻',
  'ငါ့ကို ချစ်လား 🌻',
];

const TOTAL_TIME = 30; // seconds
let tc=0, ph=false, ended=false, spawnId=null, lmi=-1, startTime;

function rc(){return C[Math.floor(Math.random()*C.length)]}
function rn(a,b){return Math.random()*(b-a)+a}

// Timer
function startTimer(){
  startTime=Date.now();
  const bar=document.getElementById('timerBar');
  function tick(){
    if(ended)return;
    const elapsed=(Date.now()-startTime)/1000;
    const pct=Math.min((elapsed/TOTAL_TIME)*100,100);
    bar.style.width=pct+'%';
    if(elapsed>=TOTAL_TIME){endGame();return}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function endGame(){
  ended=true;
  if(spawnId)clearInterval(spawnId);
  // Remove remaining hearts
  document.querySelectorAll('.float-heart').forEach(h=>{h.style.transition='opacity .5s';h.style.opacity='0';setTimeout(()=>h.remove(),600)});
  // Hide counter
  document.getElementById('ctr').style.transition='opacity .5s';
  document.getElementById('ctr').style.opacity='0';
  // Show lucky box
  setTimeout(()=>{
    document.getElementById('boxCount').textContent=tc;
    document.getElementById('luckyOverlay').classList.add('show');
  },800);
}

function startSpawning(){
  for(let i=0;i<5;i++)setTimeout(()=>spawnHeart(),i*600);
  spawnId=setInterval(spawnHeart,1200);
}

function resetGame(){
  ended=false;
  ph=false;
  tc=0;
  lmi=-1;
  if(spawnId)clearInterval(spawnId);
  document.querySelectorAll('.float-heart,.msg,.burst,.ring,.dot').forEach(el=>el.remove());
  document.getElementById('cnt').textContent='0';
  document.getElementById('boxCount').textContent='0';
  document.getElementById('timerBar').style.width='0%';
  document.getElementById('prompt').classList.remove('hide');
  document.getElementById('ctr').style.opacity='1';
  document.getElementById('luckyOverlay').classList.remove('show');
  document.getElementById('luckyMsgOverlay').classList.remove('show');
  startSpawning();
  startTimer();
}

// Open button
document.getElementById('openBtn').addEventListener('click',()=>{
  document.getElementById('luckyOverlay').classList.remove('show');
  setTimeout(()=>{
    const msg=LUCKY_MSGS[Math.floor(Math.random()*LUCKY_MSGS.length)];
    document.getElementById('luckyMsgText').textContent=msg;
    document.getElementById('luckyMsgOverlay').classList.add('show');
  },500);
});
document.getElementById('openBtn').addEventListener('touchstart',(e)=>{e.stopPropagation()},{passive:true});
document.getElementById('restartBtn').addEventListener('click',(e)=>{e.stopPropagation();resetGame()});
document.getElementById('messageRestartBtn').addEventListener('click',(e)=>{e.stopPropagation();resetGame()});
document.getElementById('restartBtn').addEventListener('touchstart',(e)=>{e.stopPropagation()},{passive:true});
document.getElementById('messageRestartBtn').addEventListener('touchstart',(e)=>{e.stopPropagation()},{passive:true});

function spawnHeart(){
  if(ended)return;
  const el=document.createElement('div');el.className='float-heart';
  const sz=rn(1.4,2.8),x=rn(8,92),dur=rn(6,12),cl=rc();
  el.textContent=H[Math.floor(Math.random()*H.length)];
  el.style.cssText=`left:${x}%;bottom:-60px;--size:${sz}rem;--dur:${dur}s;--glow:${cl};--sx1:${rn(-30,30)}px;--sx2:${rn(-25,25)}px;--sx3:${rn(-35,35)}px;--sx4:${rn(-20,20)}px;font-size:${sz}rem`;

  function onTap(e){
    e.preventDefault();e.stopPropagation();
    if(ended)return;
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(!ph){document.getElementById('prompt').classList.add('hide');ph=true}
    tc++;document.getElementById('cnt').textContent=tc;
    showMsg(cx,cy);burstH(cx,cy);showRing(cx,cy);showDots(cx,cy);
    el.style.pointerEvents='none';el.style.transition='transform .3s,opacity .3s';el.style.transform='scale(1.8)';el.style.opacity='0';
    setTimeout(()=>el.remove(),350);
  }
  el.addEventListener('touchstart',onTap,{passive:false});
  el.addEventListener('click',onTap);
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),dur*1000+500);
}

function showMsg(x,y){
  const el=document.createElement('div');el.className='msg';
  let i;do{i=Math.floor(Math.random()*M.length)}while(i===lmi);lmi=i;
  el.textContent=M[i];el.style.cssText=`left:${x}px;top:${y}px;--c:${rc()};font-size:${rn(.75,1.05).toFixed(2)}rem`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2900);
}

function burstH(x,y){
  const n=Math.floor(rn(4,7));
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='burst';
    el.textContent=BI[Math.floor(Math.random()*BI.length)];
    const a=(Math.PI*2*i)/n+rn(-.3,.3),d=rn(50,100);
    el.style.cssText=`left:${x}px;top:${y}px;--bx:${Math.cos(a)*d}px;--by:${Math.sin(a)*d}px;--br:${rn(0,360)}deg;animation-delay:${i*.03}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
  }
}

function showRing(x,y){
  const el=document.createElement('div');el.className='ring';
  el.style.cssText=`left:${x}px;top:${y}px;--rc:${rc()}55`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}

function showDots(x,y){
  for(let i=0;i<5;i++){
    const el=document.createElement('div');el.className='dot';const c=rc();
    el.style.cssText=`left:${x+rn(-25,25)}px;top:${y+rn(-25,25)}px;--dc:${c};animation-delay:${rn(0,.2)}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),700);
  }
}

document.addEventListener('touchstart',(e)=>{
  if(e.target.classList.contains('float-heart')||ended)return;
  if(!ph){document.getElementById('prompt').classList.add('hide');ph=true}
  showDots(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
},{passive:true});

document.addEventListener('click',(e)=>{
  if(e.target.classList.contains('float-heart')||e.target.classList.contains('open-btn')||e.target.classList.contains('restart-btn')||ended)return;
  if(!ph){document.getElementById('prompt').classList.add('hide');ph=true}
  showDots(e.clientX,e.clientY);
});

// ── Music ──
const audio=document.getElementById('bgMusic');
const musicBtn=document.getElementById('musicBtn');
let musicStarted=false;
audio.volume=0.5;

function tryPlayMusic(){
  if(musicStarted)return;
  audio.play().then(()=>{
    musicStarted=true;
    musicBtn.textContent='🔊';
    musicBtn.classList.add('playing');
  }).catch(()=>{});
}

musicBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  if(!musicStarted){tryPlayMusic();return}
  if(audio.paused){audio.play();musicBtn.textContent='🔊';musicBtn.classList.add('playing')}
  else{audio.pause();musicBtn.textContent='🔇';musicBtn.classList.remove('playing')}
});
musicBtn.addEventListener('touchstart',(e)=>e.stopPropagation(),{passive:true});

// Hook into first touch
document.addEventListener('touchstart',()=>tryPlayMusic(),{once:true,passive:true});
document.addEventListener('click',()=>tryPlayMusic(),{once:true});

// Init
startSpawning();
startTimer();
</script>
</body>
</html>
